apply plugin: 'com.android.application'



apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')
    implementation 'org.ftclib.ftclib:core:2.1.1'
}

// Pedro 3 dependencies match Quickstart revision 9dc89787898fab6b5cd9095df38489a14bf51a95.
repositories { maven { url 'https://repo.dairy.foundation/releases/' } }
dependencies {
    implementation 'com.pedropathing:revhub:3.0.2'
    implementation 'com.pedropathing:tuning:1.0.1'
}

// Added local copies of the user's downloaded official Dashboard artifacts.
rootProject.allprojects {
    repositories {
        exclusiveContent {
            forRepository {
                maven { name = 'LocalDashboard'; url = rootProject.file('local-maven').toURI() }
            }
            filter { includeGroup 'com.acmerobotics.dashboard' }
        }
    }
}
